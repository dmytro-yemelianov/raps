name: Helm Chart CI

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build dependencies
        run: helm dependency build deploy/helm/raps/

      - name: Lint with defaults
        run: helm lint deploy/helm/raps/ --strict

      - name: Lint with full values
        run: helm lint deploy/helm/raps/ --strict -f deploy/helm/raps/ci/full-values.yaml

      - name: Lint with minimal values
        run: helm lint deploy/helm/raps/ --strict -f deploy/helm/raps/ci/minimal-values.yaml

  helm-template:
    name: Helm Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build dependencies
        run: helm dependency build deploy/helm/raps/

      - name: Template with defaults
        run: helm template raps deploy/helm/raps/ --namespace raps-system --debug

      - name: Template with full values
        run: helm template raps deploy/helm/raps/ --namespace raps-system --debug -f deploy/helm/raps/ci/full-values.yaml

      - name: Template with minimal values
        run: helm template raps deploy/helm/raps/ --namespace raps-system --debug -f deploy/helm/raps/ci/minimal-values.yaml

  helm-unittest:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build dependencies
        run: helm dependency build deploy/helm/raps/

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 0.6.3

      - name: Run unit tests
        run: helm unittest deploy/helm/raps/ --color

  helm-all-pass:
    name: Helm All Pass
    if: always()
    needs: [helm-lint, helm-template, helm-unittest]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.helm-lint.result }}" != "success" || \
                "${{ needs.helm-template.result }}" != "success" || \
                "${{ needs.helm-unittest.result }}" != "success" ]]; then
            echo "One or more Helm CI jobs failed"
            exit 1
          fi
          echo "All Helm CI jobs passed"
