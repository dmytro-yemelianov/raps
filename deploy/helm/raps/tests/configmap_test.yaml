suite: configmap
templates:
  - templates/configmap.yaml
tests:
  - it: should create a ConfigMap
    asserts:
      - isKind:
          of: ConfigMap

  - it: should have correct name
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-raps-config

  - it: should set default RUST_LOG
    asserts:
      - equal:
          path: data.RUST_LOG
          value: "info"

  - it: should set custom RUST_LOG
    set:
      env.RUST_LOG: debug
    asserts:
      - equal:
          path: data.RUST_LOG
          value: "debug"

  - it: should set RAPS_REDIS_URL
    asserts:
      - equal:
          path: data.RAPS_REDIS_URL
          value: "redis://RELEASE-NAME-redis-master:6379"
