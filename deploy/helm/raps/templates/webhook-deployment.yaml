apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "raps.fullname" . }}-webhook
  namespace: {{ include "raps.namespace" . }}
  labels:
    {{- include "raps.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "raps.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        {{- include "raps.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webhook
    spec:
      containers:
        - name: webhook
          image: {{ include "raps.image" (dict "image" .Values.webhook.image "global" .Values.global) }}
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "raps.fullname" . }}-config
                  key: RUST_LOG
            - name: RAPS_REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "raps.fullname" . }}-config
                  key: RAPS_REDIS_URL
          envFrom:
            - secretRef:
                name: {{ include "raps.fullname" . }}-aps-credentials
          ports:
            - name: http
              containerPort: {{ .Values.webhook.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
