name: Publish to crates.io

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.6.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo registry and git index
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: ${{ github.workspace }}

      - name: Verify package
        run: cargo package --allow-dirty

      - name: Publish to crates.io
        run: |
          # Publish crates in dependency order with retry for rate limits
          CRATES=(
            raps-kernel
            raps-acc
            raps-admin
            raps-da
            raps-derivative
            raps-dm
            raps-oss
            raps-reality
            raps-webhooks
            raps-cli
          )
          FAILED=0
          for crate in "${CRATES[@]}"; do
            echo "::group::Publishing $crate"
            for attempt in 1 2 3; do
              OUTPUT=$(cargo publish -p "$crate" --allow-dirty 2>&1) && {
                echo "$crate published successfully"
                # Pause between publishes to avoid rate limits
                sleep 15
                break
              }
              if echo "$OUTPUT" | grep -q "already exists"; then
                echo "$crate already published, skipping"
                break
              elif echo "$OUTPUT" | grep -q "429"; then
                echo "Rate limited on $crate, waiting 90s (attempt $attempt/3)..."
                sleep 90
              else
                echo "$OUTPUT"
                if [ "$attempt" -eq 3 ]; then
                  echo "::error::Failed to publish $crate after 3 attempts"
                  FAILED=1
                fi
              fi
            done
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Some crates failed to publish"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

