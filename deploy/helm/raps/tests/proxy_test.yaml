suite: proxy
templates:
  - templates/proxy-deployment.yaml
  - templates/proxy-service.yaml
tests:
  # Deployment tests
  - it: should create proxy Deployment
    template: templates/proxy-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-raps-proxy

  - it: should have default 2 replicas
    template: templates/proxy-deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: should render correct image
    template: templates/proxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "rapscli/raps-proxy:5.2.0"

  - it: should have liveness and readiness probes
    template: templates/proxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health

  - it: should expose http port
    template: templates/proxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: should have component label
    template: templates/proxy-deployment.yaml
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/component: proxy

  # Service tests
  - it: should create proxy Service
    template: templates/proxy-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8080
