[package]
name = "raps-cli"
description = "RAPS (rapeseed) - Rust Autodesk Platform Services CLI"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://rapscli.xyz"
documentation = "https://rapscli.xyz/docs"
readme = "../README.md"
keywords = ["autodesk", "aps", "forge", "bim360", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version.workspace = true

[[bin]]
name = "raps"
path = "src/main.rs"

[dependencies]
# Workspace crates
raps-kernel.workspace = true
raps-oss.workspace = true
raps-derivative.workspace = true
raps-dm.workspace = true
raps-da.workspace = true
raps-acc.workspace = true
raps-admin.workspace = true
raps-webhooks.workspace = true
raps-reality.workspace = true

# CLI framework
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true

# Interactive prompts
dialoguer.workspace = true
console.workspace = true

# Error handling
anyhow.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true

# HTTP client
reqwest.workspace = true

# Async runtime
tokio.workspace = true

# Progress bars
indicatif.workspace = true

# Terminal colors
colored.workspace = true

# TUI dashboard (optional, behind "dashboard" feature)
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

# Base64 encoding for URNs
base64.workspace = true

# Date/time handling
chrono.workspace = true

# UUID generation
uuid.workspace = true

# URL parsing
url.workspace = true
urlencoding.workspace = true

# MCP Server
rmcp.workspace = true
schemars.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Interactive shell
reedline.workspace = true
nu-ansi-term.workspace = true
shlex.workspace = true

# File handling
tokio-util.workspace = true
futures-util.workspace = true

# Directories
directories.workspace = true

# Disk space queries
fs2.workspace = true

# Regular expressions (UUID validation in doctor)
regex.workspace = true

# Semver comparison (version staleness check in doctor)
semver.workspace = true

# Keyring access (for doctor keyring probe)
keyring.workspace = true

# Random number generation
rand.workspace = true

# CSV output
csv.workspace = true

# Temp files (stdin spool for piped uploads)
tempfile.workspace = true

# Glob pattern matching
glob.workspace = true

# Filesystem watching
notify.workspace = true

# Plugin signature verification
ed25519-dalek.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true

# SHA-1 for sync checksum comparison
sha1.workspace = true

# Text diffing (unified diff output for object diff command)
similar.workspace = true

# Archive inspection (tar.gz / zip via Range requests)
flate2.workspace = true
tar.workspace = true

# Worker hostname identification
hostname = { workspace = true, optional = true }

# Redis client (optional, for distributed worker)
redis = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }

# HTTP server for Kubernetes service components (optional)
axum = { workspace = true, optional = true }

[features]
default = []
dashboard = ["ratatui", "crossterm"]
redis = ["raps-kernel/redis", "dep:hostname", "dep:redis", "dep:deadpool-redis"]
kubernetes = ["raps-kernel/kubernetes", "redis", "dep:axum"]
# Enable HTTP/3 (QUIC) transport for swarm inter-agent communication.
# Activates the h3 feature in raps-kernel (quinn/QUIC backend).
# Set RAPS_SWARM_QUIC=1 or pass --quic to swarm worker start to use it.
h3 = ["raps-kernel/h3"]
mcp-http = ["dep:axum"]

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
dotenvy.workspace = true
insta.workspace = true
raps-mock.workspace = true
raps-kernel = { workspace = true, features = ["test-utils"] }

[[test]]
name = "operations"
path = "tests/operations_runner.rs"

[[test]]
name = "scenarios"
path = "tests/scenarios_runner.rs"

[[test]]
name = "cli_tests"
path = "tests/cli_tests_runner.rs"
