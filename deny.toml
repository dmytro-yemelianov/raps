[advisories]
version = 2
# Ignore unmaintained crate advisories for transitive dependencies.
# All three are resolvable by upgrading keyring (2→3) and reqwest (0.11→0.12),
# which are breaking changes tracked separately.
ignore = [
    # derivative unmaintained — transitive via keyring 2.3 → secret-service → zbus 3.x
    # Fix: upgrade keyring to 3.6+ (zbus 5.x drops derivative)
    { id = "RUSTSEC-2024-0388", reason = "Requires keyring 2→3 upgrade (breaking API changes)" },
    # instant unmaintained — transitive via keyring 2.3 → zbus 3.x → fastrand 1.x
    # Fix: upgrade keyring to 3.6+ (same fix as above, resolves both)
    { id = "RUSTSEC-2024-0384", reason = "Requires keyring 2→3 upgrade (same fix as RUSTSEC-2024-0388)" },
    # rustls-pemfile unmaintained — transitive via reqwest 0.11
    # Fix: upgrade reqwest to 0.12+ (uses rustls-pki-types directly)
    { id = "RUSTSEC-2025-0134", reason = "Requires reqwest 0.11→0.12 upgrade (breaking API changes)" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

# Allow duplicate versions of windows crates (transitive dependencies)
[bans]
multiple-versions = "warn"
