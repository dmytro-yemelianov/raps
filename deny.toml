[advisories]
version = 2
# Ignore unmaintained crate advisories for transitive dependencies
# that have no available fix.
ignore = [
    # paste unmaintained — transitive via ratatui 0.29 → paste 1.x
    # Fix: waiting for ratatui to migrate to pastey
    { id = "RUSTSEC-2024-0436", reason = "Transitive dep via ratatui; no action available until ratatui migrates" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

# Allow duplicate versions of windows crates (transitive dependencies)
[bans]
multiple-versions = "warn"
