apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "raps.fullname" . }}-worker
  namespace: {{ include "raps.namespace" . }}
  labels:
    {{- include "raps.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "raps.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus scraping on metrics port
    - ports:
        - port: {{ .Values.workers.metricsPort }}
          protocol: TCP
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    # Allow external HTTPS (APS APIs)
    - ports:
        - port: 443
          protocol: TCP
