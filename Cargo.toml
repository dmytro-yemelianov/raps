[workspace]
members = [
    "raps-kernel",
    "raps-oss",
    "raps-derivative",
    "raps-dm",
    "raps-da",
    "raps-acc",
    "raps-webhooks",
    "raps-reality",
    "raps-cli",
]
# python-bindings excluded from workspace - built separately with maturin
exclude = ["python-bindings"]
resolver = "2"

[workspace.package]
version = "5.0.0"
edition = "2024"
authors = ["Dmytro Yemelianov"]
license = "Apache-2.0"
repository = "https://github.com/dmytro-yemelianov/raps.git"
homepage = "https://rapscli.xyz"
documentation = "https://rapscli.xyz/docs"
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
raps-kernel = { path = "raps-kernel", version = "5.0.0" }
raps-oss = { path = "raps-oss", version = "5.0.0" }
raps-derivative = { path = "raps-derivative", version = "5.0.0" }
raps-dm = { path = "raps-dm", version = "5.0.0" }
raps-da = { path = "raps-da", version = "5.0.0" }
raps-acc = { path = "raps-acc", version = "5.0.0" }
raps-webhooks = { path = "raps-webhooks", version = "5.0.0" }
raps-reality = { path = "raps-reality", version = "5.0.0" }
raps-admin = { path = "raps-admin", version = "5.0.0" }

# CLI framework
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"

# Interactive prompts
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
console = "0.15"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls", "http2"], default-features = false }

# Async runtime
tokio = { version = "1.49", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
csv = "1.3"

# Environment loading
dotenvy = "0.15"

# Progress bars
indicatif = "0.18"

# Terminal colors
colored = "2.1"

# Base64 encoding for URNs
base64 = "0.22"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File handling
tokio-util = { version = "0.7", features = ["io", "codec"] }
futures-util = "0.3"

# OAuth browser flow
webbrowser = "0.8"
tiny_http = "0.12"

# Secure token storage
directories = "5.0"
keyring = "3.6"

# Memory measurement
memory-stats = "1.2"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.21", features = ["v4", "serde"] }

# Random number generation
rand = "0.8"

# URL parsing
url = "2.5"
urlencoding = "2.1"

# Regex for secret redaction
regex = "1.12"

# Glob pattern matching
glob = "0.3"

# MCP Server
rmcp = { version = "0.12", features = ["server", "transport-io", "schemars"] }
schemars = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry", "json"] }
tracing-appender = "0.2"

# TUI dashboard
ratatui = "0.29"
crossterm = "0.28"

# Interactive shell
reedline = "0.45"
nu-ansi-term = "0.50"
shlex = "1.3"

# Cryptography for plugin signature verification
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"

# Semantic versioning
semver = { version = "1.0", features = ["serde"] }

# TOML parsing for plugin manifests
toml = "0.8"

# Compression for plugin packages
flate2 = "1.0"
tar = "0.4"

# File locking for concurrent operations
fs2 = "0.4"

# Concurrent data structures
dashmap = "6"
lru = "0.12"

# Testing
assert_cmd = "2.1"
predicates = "3.1"
raps-mock = { git = "https://github.com/dmytro-yemelianov/raps-mock.git", tag = "v0.2.0" }
tokio-test = "0.4"
tempfile = "3.26"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
