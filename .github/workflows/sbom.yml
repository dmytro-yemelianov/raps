name: Generate SBOM

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v4.15.0)'
        required: true
        type: string

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx
      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --manifest-path raps-cli/Cargo.toml --format json --override-filename raps-sbom
          echo "=== Searching for generated SBOM files ==="
          find . -name "*.cdx.*" -o -name "*sbom*" 2>/dev/null | head -20
          find . -name "bom.*" 2>/dev/null | head -20
          ls -la raps-cli/ | grep -i sbom || true
          ls -la . | grep -i sbom || true
          mv raps-cli/raps-sbom.cdx.json raps-sbom-${{ github.event.inputs.tag }}.cdx.json
      - name: Upload SBOM to release
        run: gh release upload "${{ github.event.inputs.tag }}" raps-sbom-${{ github.event.inputs.tag }}.cdx.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
