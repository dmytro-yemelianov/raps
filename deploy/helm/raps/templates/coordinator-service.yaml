apiVersion: v1
kind: Service
metadata:
  name: {{ include "raps.fullname" . }}-coordinator
  namespace: {{ include "raps.namespace" . }}
  labels:
    {{- include "raps.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  type: {{ .Values.coordinator.service.type }}
  ports:
    - name: http
      port: {{ .Values.coordinator.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "raps.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
