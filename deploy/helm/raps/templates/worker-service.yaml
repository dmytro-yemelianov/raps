{{- range .Values.workers.regions }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "raps.fullname" $ }}-worker-{{ .name }}
  namespace: {{ include "raps.namespace" $ }}
  labels:
    {{- include "raps.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    raps.io/region: {{ .name }}
spec:
  type: {{ $.Values.workers.service.type }}
  ports:
    - name: http
      port: {{ $.Values.workers.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ $.Values.workers.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "raps.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    raps.io/region: {{ .name }}
{{- end }}
