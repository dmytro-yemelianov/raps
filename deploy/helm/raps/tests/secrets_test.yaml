suite: secrets
templates:
  - templates/secret.yaml
  - templates/sealed-secret.yaml
tests:
  # Plain Secret tests
  - it: should render plain Secret when sealedSecrets disabled
    template: templates/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque

  - it: should not render plain Secret when sealedSecrets enabled
    template: templates/secret.yaml
    set:
      sealedSecrets.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should have correct Secret name
    template: templates/secret.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-raps-aps-credentials

  - it: should contain credential keys
    template: templates/secret.yaml
    set:
      secrets.apsCredentials.clientId: "my-id"
      secrets.apsCredentials.clientSecret: "my-secret"
    asserts:
      - equal:
          path: stringData.APS_CLIENT_ID
          value: "my-id"
      - equal:
          path: stringData.APS_CLIENT_SECRET
          value: "my-secret"

  - it: should include webhook secret when set
    template: templates/secret.yaml
    set:
      secrets.webhookSecret: "wh-secret"
    asserts:
      - equal:
          path: stringData.APS_WEBHOOK_SECRET
          value: "wh-secret"

  - it: should omit webhook secret when empty
    template: templates/secret.yaml
    asserts:
      - isNull:
          path: stringData.APS_WEBHOOK_SECRET

  # SealedSecret tests
  - it: should render SealedSecret when enabled
    template: templates/sealed-secret.yaml
    set:
      sealedSecrets.enabled: true
      sealedSecrets.apsCredentials.encryptedData.clientId: "enc-id"
      sealedSecrets.apsCredentials.encryptedData.clientSecret: "enc-secret"
    asserts:
      - isKind:
          of: SealedSecret
      - equal:
          path: spec.encryptedData.APS_CLIENT_ID
          value: "enc-id"
      - equal:
          path: spec.encryptedData.APS_CLIENT_SECRET
          value: "enc-secret"

  - it: should not render SealedSecret when disabled
    template: templates/sealed-secret.yaml
    asserts:
      - hasDocuments:
          count: 0
