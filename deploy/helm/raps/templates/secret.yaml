{{- if not .Values.sealedSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "raps.fullname" . }}-aps-credentials
  namespace: {{ include "raps.namespace" . }}
  labels:
    {{- include "raps.labels" . | nindent 4 }}
type: Opaque
stringData:
  APS_CLIENT_ID: {{ .Values.secrets.apsCredentials.clientId | quote }}
  APS_CLIENT_SECRET: {{ .Values.secrets.apsCredentials.clientSecret | quote }}
  {{- if .Values.secrets.webhookSecret }}
  APS_WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | quote }}
  {{- end }}
{{- end }}
