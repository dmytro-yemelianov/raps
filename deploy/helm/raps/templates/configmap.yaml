apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "raps.fullname" . }}-config
  namespace: {{ include "raps.namespace" . }}
  labels:
    {{- include "raps.labels" . | nindent 4 }}
data:
  RUST_LOG: {{ .Values.env.RUST_LOG | quote }}
  RAPS_REDIS_URL: {{ include "raps.redisUrl" . | quote }}
