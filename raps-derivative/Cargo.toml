[package]
name = "raps-derivative"
description = "Model Derivative client for RAPS"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
raps-kernel.workspace = true

# Error handling
anyhow.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# HTTP client
reqwest.workspace = true

# Async runtime
tokio.workspace = true

# File handling
tokio-util.workspace = true
futures-util.workspace = true

# Progress bars
indicatif.workspace = true

# URL encoding
urlencoding.workspace = true

# Logging
tracing.workspace = true

# Base64 encoding for URNs
base64.workspace = true

# Platform cache directory resolution (for translation_cache)
directories.workspace = true

# Timestamps for translation cache entries
chrono.workspace = true

[dev-dependencies]
raps-kernel = { workspace = true, features = ["test-utils"] }
raps-mock.workspace = true
tokio-test.workspace = true
tempfile.workspace = true
insta.workspace = true
