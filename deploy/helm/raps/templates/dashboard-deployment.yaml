apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "raps.fullname" . }}-dashboard
  namespace: {{ include "raps.namespace" . }}
  labels:
    {{- include "raps.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "raps.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "raps.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: {{ include "raps.image" (dict "image" .Values.dashboard.image "global" .Values.global) }}
          command:
            - raps
            - serve
            - dashboard
            - --port
            - {{ .Values.dashboard.service.port | quote }}
            - --redis-url
            - {{ include "raps.redisUrl" . }}
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "raps.fullname" . }}-config
                  key: RUST_LOG
            - name: RAPS_REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "raps.fullname" . }}-config
                  key: RAPS_REDIS_URL
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
