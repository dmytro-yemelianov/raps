suite: helpers
templates:
  - templates/configmap.yaml
  - templates/proxy-deployment.yaml
tests:
  - it: should render default name
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-raps-config

  - it: should use nameOverride
    template: templates/configmap.yaml
    set:
      nameOverride: myapp
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-myapp-config

  - it: should use fullnameOverride
    template: templates/configmap.yaml
    set:
      fullnameOverride: custom-raps
    asserts:
      - equal:
          path: metadata.name
          value: custom-raps-config

  - it: should truncate long names to 63 chars
    template: templates/configmap.yaml
    set:
      fullnameOverride: this-is-a-very-long-name-that-should-be-truncated-to-sixty-three-characters-total
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^.{1,70}-config$"

  - it: should include standard labels
    template: templates/configmap.yaml
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: raps
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm

  - it: should include chart version label
    template: templates/configmap.yaml
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            helm.sh/chart: raps-0.1.0

  - it: should include app version label
    template: templates/configmap.yaml
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/version: "5.2.0"

  - it: should render default Redis URL
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: data.RAPS_REDIS_URL
          value: "redis://RELEASE-NAME-redis-master:6379"

  - it: should render external Redis URL
    template: templates/configmap.yaml
    set:
      messageBus.redis.external.enabled: true
      messageBus.redis.external.url: "redis://external-host:6380"
    asserts:
      - equal:
          path: data.RAPS_REDIS_URL
          value: "redis://external-host:6380"

  - it: should render default image with GHCR registry
    template: templates/proxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/dmytro-yemelianov/raps-proxy:5.2.0"

  - it: should render image with custom registry override
    template: templates/proxy-deployment.yaml
    set:
      global.image.registry: custom.registry.io/myorg
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "custom.registry.io/myorg/raps-proxy:5.2.0"

  - it: should use namespace override
    template: templates/configmap.yaml
    set:
      global.namespace: custom-ns
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns
