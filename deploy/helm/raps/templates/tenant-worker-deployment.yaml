{{- if .Values.tenants.enabled }}
{{- range .Values.tenants.list }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "raps.fullname" $ }}-worker-tenant-{{ .name }}
  namespace: raps-tenant-{{ .name }}
  labels:
    {{- include "raps.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    raps.io/tenant: {{ .name }}
spec:
  replicas: {{ .workerReplicas | default $.Values.tenants.defaultWorkerReplicas }}
  selector:
    matchLabels:
      {{- include "raps.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: worker
      raps.io/tenant: {{ .name }}
  template:
    metadata:
      labels:
        {{- include "raps.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: worker
        raps.io/tenant: {{ .name }}
    spec:
      serviceAccountName: {{ include "raps.fullname" $ }}-worker
      containers:
        - name: worker
          image: {{ include "raps.image" (dict "image" $.Values.workers.image "global" $.Values.global) }}
          command:
            - raps
            - swarm
            - worker
            - start
            - --redis-url
            - {{ include "raps.redisUrl" $ }}
            - --concurrency
            - {{ $.Values.workers.concurrency | quote }}
            - --metrics-port
            - {{ $.Values.workers.metricsPort | quote }}
          env:
            - name: RUST_LOG
              value: {{ $.Values.env.RUST_LOG | quote }}
            - name: RAPS_REDIS_URL
              value: {{ include "raps.redisUrl" $ | quote }}
          envFrom:
            - secretRef:
                name: {{ include "raps.fullname" $ }}-tenant-{{ .name }}-credentials
          ports:
            - name: metrics
              containerPort: {{ $.Values.workers.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.workers.resources | nindent 12 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "raps.fullname" $ }}-tenant-{{ .name }}-credentials
  namespace: raps-tenant-{{ .name }}
  labels:
    {{- include "raps.labels" $ | nindent 4 }}
    raps.io/tenant: {{ .name }}
type: Opaque
stringData:
  APS_CLIENT_ID: {{ .clientId | default "" | quote }}
  APS_CLIENT_SECRET: {{ .clientSecret | default "" | quote }}
{{- end }}
{{- end }}
