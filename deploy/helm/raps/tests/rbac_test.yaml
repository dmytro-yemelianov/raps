suite: rbac
templates:
  - templates/rbac.yaml
tests:
  - it: should render Role and RoleBinding (2 documents)
    asserts:
      - hasDocuments:
          count: 2

  - it: should create a Role
    documentIndex: 0
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: RELEASE-NAME-raps-worker

  - it: should allow configmap access
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get", "list", "watch"]

  - it: should allow specific secret access
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            resourceNames:
              - RELEASE-NAME-raps-aps-credentials
            verbs: ["get"]

  - it: should create a RoleBinding
    documentIndex: 1
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: roleRef.kind
          value: Role
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-raps-worker
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io

  - it: should bind to worker ServiceAccount
    documentIndex: 1
    asserts:
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-raps-worker
