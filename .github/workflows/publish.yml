name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.6.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo registry and git index
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: ${{ github.workspace }}

      - name: Verify package
        run: cargo package --allow-dirty

      - name: Publish to crates.io
        run: |
          # Publish crates in dependency order, skipping already-published versions
          CRATES=(
            raps-kernel
            raps-acc
            raps-admin
            raps-da
            raps-derivative
            raps-dm
            raps-oss
            raps-reality
            raps-webhooks
            raps-cli
          )
          FAILED=0
          for crate in "${CRATES[@]}"; do
            echo "::group::Publishing $crate"
            VERSION=$(cargo metadata --no-deps --format-version 1 | \
              jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            # Check if already published
            if cargo search "$crate" 2>/dev/null | grep -q "^$crate = \"$VERSION\""; then
              echo "$crate@$VERSION already published, skipping"
              echo "::endgroup::"
              continue
            fi
            if cargo publish -p "$crate" --allow-dirty; then
              echo "$crate@$VERSION published successfully"
              # Brief pause to avoid rate limits
              sleep 5
            else
              echo "::error::Failed to publish $crate@$VERSION"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Some crates failed to publish"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

