apiVersion: v1
kind: Service
metadata:
  name: {{ include "raps.fullname" . }}-proxy
  namespace: {{ include "raps.namespace" . }}
  labels:
    {{- include "raps.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: {{ .Values.proxy.service.type }}
  ports:
    - name: http
      port: {{ .Values.proxy.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "raps.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
