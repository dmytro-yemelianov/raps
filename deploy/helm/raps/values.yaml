# -- Global configuration
global:
  image:
    registry: "ghcr.io/dmytro-yemelianov"
    tag: "5.2.0"
  namespace: ""

nameOverride: ""
fullnameOverride: ""

# -- Proxy configuration
proxy:
  replicaCount: 2
  image:
    registry: ""
    repository: raps-proxy
    tag: ""
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 8080
  cache:
    backend: redis
    ttlSeconds: 300
    maxEntries: 100000

# -- Worker configuration
workers:
  minReplicas: 2
  maxReplicas: 20
  concurrency: 4
  heartbeatSecs: 30
  metricsPort: 9091
  image:
    registry: ""
    repository: raps-worker
    tag: ""
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 9090
    metricsPort: 9091
  hpa:
    metric: raps_queue_depth
    targetValue: 5
    scaleUp:
      stabilizationWindowSeconds: 30
      maxPods: 4
      periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      maxPods: 2
      periodSeconds: 120
  regions:
    - name: us
      nodeSelector:
        topology.kubernetes.io/region: us-east-1
      env:
        ADS_REGION: US
      replicas: 2
    - name: emea
      nodeSelector:
        topology.kubernetes.io/region: eu-west-1
      env:
        ADS_REGION: EMEA
      replicas: 2

# -- Coordinator configuration
coordinator:
  replicaCount: 2
  image:
    registry: ""
    repository: raps-coordinator
    tag: ""
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 8081

# -- Webhook gateway configuration
webhook:
  image:
    registry: ""
    repository: raps-webhook
    tag: ""
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 9000
  ingress:
    enabled: false
    className: nginx
    host: hooks.rapscli.xyz
    tls:
      enabled: true
      secretName: raps-webhook-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

# -- Dashboard configuration
dashboard:
  replicaCount: 1
  image:
    registry: ""
    repository: raps-dashboard
    tag: ""
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: nginx
    host: dashboard.rapscli.xyz
    tls:
      enabled: true
      secretName: raps-dashboard-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

# -- Message bus (Redis)
messageBus:
  redis:
    enabled: true
    external:
      enabled: false
      url: ""
    # Bitnami Redis subchart values
    architecture: standalone
    auth:
      enabled: true
      existingSecret: raps-redis-secret
      existingSecretPasswordKey: redis-password
    master:
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
      persistence:
        enabled: true
        size: 1Gi

# -- Multi-tenant configuration
tenants:
  enabled: false
  isolation: namespace
  defaultWorkerReplicas: 2
  maxWorkerReplicas: 10
  list: []
  #  - name: acme
  #    clientId: ""
  #    clientSecret: ""
  #    workerReplicas: 3

# -- Monitoring
monitoring:
  prometheus:
    serviceMonitor:
      enabled: false
      interval: "30s"
      namespace: ""
      labels: {}
  grafana:
    enabled: false
    dashboards:
      enabled: false
      label: grafana_dashboard
      labelValue: "1"

# -- Sealed Secrets
sealedSecrets:
  enabled: false
  apsCredentials:
    encryptedData:
      clientId: ""
      clientSecret: ""

# -- Plain Secrets (for non-SealedSecrets setups)
secrets:
  apsCredentials:
    clientId: ""
    clientSecret: ""
  webhookSecret: ""

# -- CronJobs for scheduled pipelines
cronJobs: []
#  - name: nightly-translate
#    schedule: "0 2 * * *"
#    pipeline: pipelines/nightly.yaml
#    concurrencyPolicy: Forbid
#    backoffLimit: 2
#    activeDeadlineSeconds: 7200

# -- Common environment variables
env:
  RUST_LOG: info
